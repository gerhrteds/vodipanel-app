name: Build APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.0.1)"
        default: "1.0.0"
      version_code:
        description: "Version code (integer, must increase every release)"
        default: "1"
  push:
    branches: [main]

env:
  SING_BOX_TAG: v1.11.4          # sing-box release used for libbox.aar

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }

      - name: Build libbox.aar (sing-box core)
        run: |
          git clone --depth 1 --branch "$SING_BOX_TAG" https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          GM=$(go list -m -f '{{.Version}}' github.com/sagernet/gomobile)
          go install -v github.com/sagernet/gomobile/cmd/gomobile@$GM
          go install -v github.com/sagernet/gomobile/cmd/gobind@$GM
          export PATH="$PATH:$(go env GOPATH)/bin"
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          go run ./cmd/internal/build_libbox -target android
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp libbox.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"
          ls -la "$GITHUB_WORKSPACE/app/libs"

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: Restore signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_B64 secret: APK is signed with the debug key. Users will NOT be able to update over it with a differently signed build."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
          VERSION_CODE: ${{ github.event.inputs.version_code || github.run_number }}
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VodiPanel-apk
          path: app/build/outputs/apk/release/*.apk
